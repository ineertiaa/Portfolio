        <script src="gsap/gsap.min.js"></script>
        <script src="gsap/TextPlugin.min.js"></script>
        <script src="gsap/ScrollTrigger.min.js"></script>

        <!-- hello world anim or something -->
        <script>
            gsap.to(".intro", {
                duration: 0.3,
                text: {
                    value: "Hello, World!",
                    speed: 0.7,
                },
                opacity: 1,
                ease: "none"
            });
        </script>

        <script>
            let today = new Date();
            let birthDate = new Date("2013-04-03")
            document.getElementById("age").innerText = today.getFullYear() - birthDate.getFullYear()
        </script>

        <script>
            gsap.from(".title_text", {
                scrollTrigger: {
                    trigger: ".title",
                    start: "top 60%",
                },
                duration: 1,
                ease: "power4.out",
                x: -100,
                y: 100,
                opacity: 0,
                toggleActions: "play none none reverse"
            });

            gsap.from(".title_img", {
                scrollTrigger: {
                    trigger: ".title",
                    start: "top 60%",
                },
                duration: 1,
                ease: "power4.out",
                x: 100,
                y: 100,
                opacity: 0,
                toggleActions: "play none none reverse"
            });

            gsap.from(".tech_stack", {
                scrollTrigger: {
                    trigger: ".tech_stack",
                    start: "top 60%",
                },
                duration: 2,
                ease: "expo.out",
                x: -50,
                y: 200,
                opacity: 0,
                toggleActions: "play none none reverse"
            })
        </script>
